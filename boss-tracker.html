<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss notification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>

  
  :root{
    --bg: #141F19;
    --bg-2: #0F1814;
    --surface: #1E2C24;
    --surface-2: #24352B;
    --line: #34473A;
    --ember: #E8944A;
    --ember-bright: #FFC17E;
    --alive: #7FA88A;
    --text: #EEE7D4;
    --text-dim: #98A99A;
    --danger: #C97157;
    --grinder: #7FA8D6;
    --grinder-bright: #A9C6EC;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #1C2A22 0%, var(--bg) 45%, var(--bg-2) 100%);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .embers{
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .ember-dot{
    position: absolute;
    bottom: -10px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--ember);
    box-shadow: 0 0 6px 2px rgba(232,148,74,0.55);
    opacity: 0;
    animation: drift 9s linear infinite;
  }
  @keyframes drift{
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: 0.8; }
    100% { transform: translateY(-100vh) translateX(var(--dx, 20px)); opacity: 0; }
  }

  .wrap{
    position: relative; z-index: 1;
    max-width: 1040px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  header{
    text-align: center;
    margin-bottom: 8px;
  }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ember);
    margin-bottom: 14px;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(32px, 5vw, 48px);
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  h1 em{
    font-style: italic;
    font-weight: 500;
    color: var(--ember-bright);
  }
  .sub{
    color: var(--text-dim);
    font-size: 15px;
    max-width: 480px;
    margin: 0 auto 28px;
    line-height: 1.6;
  }

  .notify-row{
    display:flex; justify-content:center; align-items:center; gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 44px;
  }
  .notify-btn{
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
    transition: border-color .2s, color .2s;
    display:flex; align-items:center; gap:8px;
  }
  .notify-btn:hover{ border-color: var(--ember); color: var(--text); }
  .notify-btn .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--danger);
    display:inline-block;
  }
  .notify-btn.on .dot{ background: var(--alive); box-shadow: 0 0 6px 1px rgba(127,168,138,0.6); }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
  }

  .card{
    position: relative;
    background: linear-gradient(175deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 20px 20px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap: 14px;
    transition: border-color .3s, transform .2s;
  }
  .card.ready{
    border-color: var(--ember);
    box-shadow: 0 0 0 1px rgba(232,148,74,0.25), 0 0 28px -6px rgba(232,148,74,0.55);
    animation: pulseCard 1.8s ease-in-out infinite;
  }
  @keyframes pulseCard{
    0%,100%{ box-shadow: 0 0 0 1px rgba(232,148,74,0.2), 0 0 20px -8px rgba(232,148,74,0.4); }
    50%{ box-shadow: 0 0 0 1px rgba(232,148,74,0.45), 0 0 34px -4px rgba(232,148,74,0.75); }
  }

  .name-row{ width:100%; }
  .boss-name{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    cursor: text;
    border-bottom: 1px dashed transparent;
    padding-bottom: 2px;
    word-break: break-word;
  }
  .boss-name:hover{ border-bottom-color: var(--line); }
  .name-input{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--ember);
    color: var(--text);
    text-align:center;
    width: 100%;
    outline: none;
  }

  .status{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(127,168,138,0.12);
    color: var(--alive);
  }
  .status.waiting{ background: rgba(232,148,74,0.12); color: var(--ember-bright); }
  .status.ready{ background: rgba(232,148,74,0.22); color: var(--ember-bright); }

  .ring-wrap{
    position: relative;
    width: 128px; height: 128px;
    display:flex; align-items:center; justify-content:center;
  }
  .ring-wrap svg{ transform: rotate(-90deg); }
  .ring-bg{ fill:none; stroke: var(--line); stroke-width: 6; }
  .ring-fg{ fill:none; stroke: var(--ember); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .timer{
    position:absolute;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .timer.small{ font-size: 13px; color: var(--text-dim); letter-spacing: 0.04em; }

  .grinder-global{
    display:flex; align-items:center; gap: 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 8px 6px 16px;
    background: transparent;
    transition: border-color .2s;
  }
  .grinder-global.active{ border-color: var(--grinder); }
  .grinder-global .grinder-label{
    line-height: 1.2;
  }
  .grinder-global .grinder-label .title{
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
  }
  .grinder-global.active .grinder-label .title{ color: var(--text); }
  .grinder-global .grinder-label .hint{
    font-size: 10.5px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
  }
  .switch{
    position: relative;
    width: 42px; height: 24px;
    flex-shrink: 0;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-2);
    cursor: pointer;
    padding: 0;
    transition: background .2s, border-color .2s;
  }
  .switch .knob{
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform .2s, background .2s;
  }
  .switch.active{
    background: rgba(127,168,214,0.22);
    border-color: var(--grinder);
  }
  .switch.active .knob{
    transform: translateX(18px);
    background: var(--grinder-bright);
  }

  .actions{ display:flex; gap: 8px; width:100%; }
  .btn{
    flex:1;
    font-family: 'Work Sans', sans-serif;
    font-weight: 500;
    font-size: 13.5px;
    padding: 10px 10px;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .15s, filter .15s, background .2s;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{
    background: var(--ember);
    color: #1A1108;
  }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-ghost{
    background: transparent;
    border-color: var(--line);
    color: var(--text-dim);
  }
  .btn-ghost:hover{ border-color: var(--danger); color: var(--danger); }

  footer{
    text-align:center;
    margin-top: 48px;
    color: var(--text-dim);
    font-size: 12.5px;
    line-height: 1.7;
  }
  footer code{
    font-family: 'IBM Plex Mono', monospace;
    background: var(--surface);
    padding: 1px 6px;
    border-radius: 5px;
    border: 1px solid var(--line);
  }

  @media (prefers-reduced-motion: reduce){
    .ember-dot{ animation: none; display:none; }
    .card.ready{ animation: none; }
  }
</style>
</head>
<body>

<div class="embers" id="embers"></div>

<div class="wrap">
  <header>
    <div class="eyebrow">Boss notification</div>
    <h1>Boss<em>Timers</em></h1>
    <p class="sub">สุดโหด</p>
  </header>

  <div class="notify-row">
    <button class="notify-btn" id="notifyBtn">
      <span class="dot"></span>
      <span id="notifyLabel">เปิดการแจ้งเตือน</span>
    </button>
    <button class="grinder-global" id="grinderGlobalBtn" role="switch" aria-checked="false">
      <span class="grinder-label">
        <span class="title">Grinder</span>
        <span class="hint">-15% เวลาเกิด (ทุกบอส)</span>
      </span>
      <span class="switch" id="grinderSwitch"><span class="knob"></span></span>
    </button>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    ตั้งเวลาไว้ที่ <code>45 นาที</code> ต่อบอสหนึ่งตัว &middot; แตะชื่อบอสเพื่อแก้ไข &middot; เปิดสวิตช์ <code>Grinder</code> ด้านบนเพื่อลดเวลาเกิดใหม่ 15% ให้ทุกบอสพร้อมกัน &middot; ข้อมูลจะถูกจำไว้ในเครื่องนี้
  </footer>
</div>

<script>
(function(){
  const RESPAWN_MS = 45 * 60 * 1000;
  const GRINDER_MULTIPLIER = 0.85; // grinder trait: 15% shorter respawn
  const STORAGE_KEY = 'boss-camp-state-v1';
  const RADIUS = 56;
  const CIRC = 2 * Math.PI * RADIUS;

  const defaultState = () => ([
    { id: 1, name: 'บอสจุดที่ 1', deadAt: null },
    { id: 2, name: 'บอสจุดที่ 2', deadAt: null },
    { id: 3, name: 'บอสจุดที่ 3', deadAt: null },
    { id: 4, name: 'บอสจุดที่ 4', deadAt: null },
    { id: 5, name: 'บอสจุดที่ 5', deadAt: null },
  ]);

  let bosses = defaultState();
  let grinderActive = false;
  const notified = new Set();
  let audioCtx = null;
  let editingId = null;
  const els = {}; // per-boss element refs, filled by render()

  const grid = document.getElementById('grid');
  const notifyBtn = document.getElementById('notifyBtn');
  const notifyLabel = document.getElementById('notifyLabel');
  const grinderGlobalBtn = document.getElementById('grinderGlobalBtn');
  const grinderSwitch = document.getElementById('grinderSwitch');

  function fmt(ms){
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function currentRespawnMs(){
    return grinderActive ? Math.round(RESPAWN_MS * GRINDER_MULTIPLIER) : RESPAWN_MS;
  }

  function updateGrinderGlobalUI(){
    grinderGlobalBtn.classList.toggle('active', grinderActive);
    grinderGlobalBtn.setAttribute('aria-checked', grinderActive ? 'true' : 'false');
    grinderSwitch.classList.toggle('active', grinderActive);
  }

  grinderGlobalBtn.addEventListener('click', () => {
    grinderActive = !grinderActive;
    updateGrinderGlobalUI();
    saveState();
    render();
  });

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length === 5){
          // Older save format: plain array of bosses, no global grinder flag yet.
          bosses = parsed;
        } else if(parsed && Array.isArray(parsed.bosses) && parsed.bosses.length === 5){
          bosses = parsed.bosses;
          grinderActive = !!parsed.grinderActive;
        }
      }
    }catch(e){ /* no saved state yet, or storage unavailable — use defaults */ }
    updateGrinderGlobalUI();
    render();
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ bosses, grinderActive }));
    }catch(e){ console.error('Storage error', e); }
  }

  function playChime(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      [660, 880].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, now + i * 0.18);
        gain.gain.linearRampToValueAtTime(0.18, now + i * 0.18 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + i * 0.18);
        osc.stop(now + i * 0.18 + 0.55);
      });
    }catch(e){ /* audio not available */ }
  }

  function notify(boss){
    playChime();
    if(window.Notification && Notification.permission === 'granted'){
      try{
        new Notification('บอสพร้อมล่าแล้ว! 🔥', {
          body: boss.name + ' รีแล้วไอสัส ไปตีเอาของ',
          tag: 'boss-' + boss.id
        });
      }catch(e){ /* ignore */ }
    }
  }

  function updateNotifyBtn(){
    const supported = 'Notification' in window;
    if(!supported){
      notifyLabel.textContent = 'เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน';
      notifyBtn.disabled = true;
      return;
    }
    if(Notification.permission === 'granted'){
      notifyBtn.classList.add('on');
      notifyLabel.textContent = 'แจ้งเตือนพร้อมใช้งาน';
    } else {
      notifyBtn.classList.remove('on');
      notifyLabel.textContent = 'เปิดการแจ้งเตือน';
    }
  }

  notifyBtn.addEventListener('click', async () => {
    if(!('Notification' in window)) return;
    if(Notification.permission !== 'granted'){
      await Notification.requestPermission();
    }
    updateNotifyBtn();
  });

  function markDead(id){
    const boss = bosses.find(b => b.id === id);
    boss.deadAt = Date.now();
    notified.delete(id);
    saveState();
    render();
  }

  function reset(id){
    const boss = bosses.find(b => b.id === id);
    boss.deadAt = null;
    notified.delete(id);
    saveState();
    render();
  }

  function startRename(id, nameEl){
    const boss = bosses.find(b => b.id === id);
    editingId = id;
    const input = document.createElement('input');
    input.className = 'name-input';
    input.value = boss.name;
    input.maxLength = 24;
    nameEl.replaceWith(input);
    input.focus();
    input.select();
    let done = false;
    const commit = () => {
      if(done) return;
      done = true;
      const val = input.value.trim() || boss.name;
      boss.name = val;
      editingId = null;
      saveState();
      render();
    };
    const cancel = () => {
      if(done) return;
      done = true;
      editingId = null;
      render();
    };
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter') input.blur();
      if(e.key === 'Escape') cancel();
    });
  }

  function bossPhase(boss, now){
    const respawn = currentRespawnMs();
    const remaining = boss.deadAt ? (boss.deadAt + respawn - now) : null;
    const isWaiting = remaining !== null && remaining > 0;
    const isReady = remaining !== null && remaining <= 0;
    const isAlive = boss.deadAt === null;
    return { remaining, isWaiting, isReady, isAlive, respawn };
  }

  // Full rebuild: call after actions that change structure (mark dead, reset, rename commit, load, grinder toggle).
  // Does NOT run on the per-second timer, so it never interrupts an in-progress name edit.
  function render(){
    grid.innerHTML = '';
    const now = Date.now();

    bosses.forEach(boss => {
      const { remaining, isWaiting, isReady, isAlive, respawn } = bossPhase(boss, now);

      if(isReady && !notified.has(boss.id)){
        notified.add(boss.id);
        notify(boss);
      }

      const card = document.createElement('div');
      card.className = 'card' + (isReady ? ' ready' : '');

      const nameRow = document.createElement('div');
      nameRow.className = 'name-row';
      const nameEl = document.createElement('div');
      nameEl.className = 'boss-name';
      nameEl.textContent = boss.name;
      nameEl.title = 'แตะเพื่อแก้ไขชื่อ';
      nameEl.addEventListener('click', () => startRename(boss.id, nameEl));
      nameRow.appendChild(nameEl);

      const statusEl = document.createElement('div');
      statusEl.className = 'status' + (isWaiting ? ' waiting' : '') + (isReady ? ' ready' : '');
      statusEl.textContent = isAlive ? 'มีชีวิต' : isWaiting ? 'กำลังเกิดใหม่' : 'พร้อมล่า!';

      const ringWrap = document.createElement('div');
      ringWrap.className = 'ring-wrap';

      const pct = isWaiting ? Math.min(1, Math.max(0, 1 - remaining / respawn)) : (isReady ? 1 : 0);
      const offset = CIRC * (1 - pct);

      ringWrap.innerHTML = `
        <svg width="128" height="128" viewBox="0 0 128 128">
          <circle class="ring-bg" cx="64" cy="64" r="${RADIUS}"></circle>
          <circle class="ring-fg" cx="64" cy="64" r="${RADIUS}"
            stroke-dasharray="${CIRC}" stroke-dashoffset="${isAlive ? CIRC : offset}"></circle>
        </svg>
      `;
      const timerEl = document.createElement('div');
      timerEl.className = 'timer' + (isAlive ? ' small' : '');
      timerEl.textContent = isAlive ? 'ยังไม่ตี พร้อมลั่น' : isReady ? 'พร้อมลั่นแล้วสัส' : fmt(remaining);
      ringWrap.appendChild(timerEl);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const mainBtn = document.createElement('button');
      mainBtn.className = 'btn btn-primary';
      mainBtn.textContent = isAlive ? 'แห้ง' : isReady ? 'แห้งอีกแล้ว' : 'แห้งแล้ว';
      mainBtn.addEventListener('click', () => markDead(boss.id));
      actions.appendChild(mainBtn);

      let resetBtn = null;
      if(!isAlive){
        resetBtn = document.createElement('button');
        resetBtn.className = 'btn btn-ghost';
        resetBtn.textContent = 'รีเซ็ต';
        resetBtn.addEventListener('click', () => reset(boss.id));
        actions.appendChild(resetBtn);
      }

      card.appendChild(nameRow);
      card.appendChild(statusEl);
      card.appendChild(ringWrap);
      card.appendChild(actions);
      grid.appendChild(card);

      els[boss.id] = { card, nameEl, statusEl, timerEl, ringFg: ringWrap.querySelector('.ring-fg'), mainBtn, actions, resetBtn };
    });
  }

  // Lightweight per-second update: only touches numbers/status/button text.
  // Never rebuilds the name area, so an open rename <input> is left completely alone.
  function tick(){
    const now = Date.now();
    let structuralChange = false;

    bosses.forEach(boss => {
      const ref = els[boss.id];
      if(!ref) return;
      const { remaining, isWaiting, isReady, isAlive, respawn } = bossPhase(boss, now);

      // isAlive <-> !isAlive changes the reset button's presence — needs a full render.
      const hasResetBtn = !!ref.resetBtn;
      if(isAlive === hasResetBtn){ structuralChange = true; }

      if(isReady && !notified.has(boss.id)){
        notified.add(boss.id);
        notify(boss);
      }

      if(editingId === boss.id){
        // Name input is open for this boss — skip touching this card entirely.
        return;
      }

      ref.card.className = 'card' + (isReady ? ' ready' : '');
      ref.statusEl.className = 'status' + (isWaiting ? ' waiting' : '') + (isReady ? ' ready' : '');
      ref.statusEl.textContent = isAlive ? 'พร้อมลั่น' : isWaiting ? 'กำลังรี' : 'พร้อมล่า!';

      const pct = isWaiting ? Math.min(1, Math.max(0, 1 - remaining / respawn)) : (isReady ? 1 : 0);
      ref.ringFg.setAttribute('stroke-dashoffset', isAlive ? CIRC : CIRC * (1 - pct));

      ref.timerEl.className = 'timer' + (isAlive ? ' small' : '');
      ref.timerEl.textContent = isAlive ? 'ยังไม่รี' : isReady ? 'มาละพร้อมลั่น' : fmt(remaining);

      ref.mainBtn.textContent = isAlive ? 'บอสแห้ง' : isReady ? 'แห้งอีกแล้ว' : 'บอสแห้งแล่ว';
    });

    if(structuralChange) render();
  }

  function spawnEmbers(){
    const container = document.getElementById('embers');
    for(let i=0;i<14;i++){
      const dot = document.createElement('div');
      dot.className = 'ember-dot';
      dot.style.left = (Math.random()*100) + 'vw';
      dot.style.setProperty('--dx', (Math.random()*40-20) + 'px');
      dot.style.animationDelay = (Math.random()*9) + 's';
      dot.style.animationDuration = (7 + Math.random()*5) + 's';
      container.appendChild(dot);
    }
  }

  updateNotifyBtn();
  spawnEmbers();
  loadState();
  setInterval(tick, 1000);
})();
</script>

</body>
</html>
