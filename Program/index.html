<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร้านเช่าชุดและเครื่องแต่งกาย</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="logo" onclick="go('search')" role="link" tabindex="0">👗 <b>Elegance</b> ร้านเช่าชุด</div>
  <nav id="nav" hidden>
    <span>👤 <span id="who"></span></span>
    <a onclick="cart()">ตะกร้า</a>
    <a onclick="logout()">ออกจากระบบ</a>
  </nav>
</header>



<main>


<!-- 1. Login / Register -->
<section id="login" class="page">
  <h1 style="text-align:center">เข้าสู่ระบบ / สมัครสมาชิก</h1>
  <form class="card narrow" id="lf">
    <h2>เข้าสู่ระบบสมาชิก</h2>
    <input id="uname" placeholder="ชื่อผู้ใช้ / อีเมล" required>
    <input id="tel" type="tel" placeholder="เบอร์โทรศัพท์" hidden>
    <input type="password" placeholder="รหัสผ่าน" required minlength="4">
    <button class="btn main" id="lbtn">เข้าสู่ระบบ</button>
    <p class="or" id="orTxt">ยังไม่มีบัญชี?</p>
    <button type="button" class="btn main alt" id="rbtn">สมัครสมาชิกใหม่</button>
  </form>
</section>

<!-- 2. Search dresses -->
<section id="search" class="page" hidden>
  <h1>ค้นหาและรายการชุด</h1>
  <div class="bar">
    <input id="q" placeholder="ค้นหาชุด (ชื่อ / ประเภท / ไซซ์)">
    <button class="btn main" id="qb">ค้นหา</button>
    <select id="sz"><option value="">ตัวกรอง: ทุกไซซ์</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
  </div>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</section>

<!-- 3. Dress detail + booking -->
<section id="booking" class="page" hidden>
  <h1>รายละเอียดชุด / จองและเช่าชุด</h1>
  <div class="two">
    <div class="card" id="detail"></div>
    <form class="card" id="bf">
      <h2>แบบฟอร์มการจองและเช่าชุด</h2>
      <div class="dates">
        <label>วันที่รับชุด<input type="date" id="d1" required></label>
        <label>วันที่คืนชุด<input type="date" id="d2" required></label>
      </div>
      <input id="rn" placeholder="ชื่อ-นามสกุลผู้เช่า" required>
      <input id="ct" placeholder="ที่อยู่ / ช่องทางติดต่อ / รับที่ร้าน" required>
      <div class="sum" id="sum"></div>
      <button class="btn main" id="bbtn">ยืนยันการจอง/เช่าชุด</button>
    </form>
  </div>
</section>

<!-- 4. Payment + receipt -->
<section id="payment" class="page" hidden>
  <h1>ชำระเงินและใบเสร็จ</h1>
  <div class="card box" id="pinfo"></div>
  <div class="card box">
    <h2>ช่องทางการชำระเงิน</h2>
    <div class="pay" id="pay"></div>
    <button class="btn main" id="pbtn" disabled>ยืนยันการชำระเงิน</button>
  </div>
  <div class="card box receipt" id="rc" hidden></div>
</section>
</main>

<script>
const $=i=>document.getElementById(i), f=n=>n.toLocaleString('th-TH');
const cats=['ทั้งหมด','ชุดไทย','ชุดราตรี','ชุดสูท','ชุดแฟนซี'];
const pays=[['bank_transfer','🏦 โอนผ่านธนาคาร'],['promptpay','📱 พร้อมเพย์ / QR'],['pay_at_shop','🏪 ชำระที่ร้าน']];
// Demo data — mirrors the rows in database.sql (replace with a fetch() to your backend)
const dresses=[
 {id:1,code:'A123',n:'ชุดราตรีสีทอง',t:'ชุดราตรี',s:'M',c:'ทอง',h:'#e6c26e',p:800,d:1000,ok:1},
 {id:2,code:'T045',n:'ชุดไทยจิตรลดา',t:'ชุดไทย',s:'S',c:'ชมพู',h:'#f2a6c0',p:600,d:800,ok:1},
 {id:3,code:'S210',n:'สูทสีกรมท่า',t:'ชุดสูท',s:'L',c:'กรมท่า',h:'#5b78a8',p:500,d:700,ok:0},
 {id:4,code:'F311',n:'ชุดแฟนซีแม่มด',t:'ชุดแฟนซี',s:'M',c:'ดำ',h:'#8d7a99',p:350,d:500,ok:1},
 {id:5,code:'T067',n:'ชุดไทยประยุกต์',t:'ชุดไทย',s:'M',c:'เขียว',h:'#7cc3a0',p:700,d:900,ok:1},
 {id:6,code:'A150',n:'ชุดราตรีสีแดง',t:'ชุดราตรี',s:'S',c:'แดง',h:'#e57a8a',p:900,d:1200,ok:0},
 {id:7,code:'S118',n:'สูทสีดำ',t:'ชุดสูท',s:'XL',c:'ดำ',h:'#9a8fa3',p:550,d:800,ok:1},
 {id:8,code:'F402',n:'ชุดแฟนซีเจ้าหญิง',t:'ชุดแฟนซี',s:'S',c:'ฟ้า',h:'#8fc7ea',p:400,d:600,ok:1}
];
let cat='ทั้งหมด', cur=null, bk=null, method=null, seq=123, days=1, reg=false;

function go(id){document.querySelectorAll('.page').forEach(s=>s.hidden=s.id!==id);scrollTo(0,0)}
function cart(){cur?go('booking'):alert('ยังไม่ได้เลือกชุด')}
function logout(){$('nav').hidden=true;cur=null;go('login')}

// Login / register
$('rbtn').onclick=()=>{
  reg=!reg;$('tel').hidden=!reg;$('tel').required=reg;
  $('lbtn').textContent=reg?'สมัครสมาชิก':'เข้าสู่ระบบ';
  $('rbtn').textContent=reg?'กลับไปเข้าสู่ระบบ':'สมัครสมาชิกใหม่';
  $('orTxt').textContent=reg?'มีบัญชีอยู่แล้ว?':'ยังไม่มีบัญชี?';
};
$('lf').onsubmit=e=>{e.preventDefault();$('who').textContent=$('uname').value.split('@')[0];$('nav').hidden=false;go('search')};

// Search
function show(){
  const q=$('q').value.trim().toLowerCase(), z=$('sz').value;
  const list=dresses.filter(x=>(cat==='ทั้งหมด'||x.t===cat)&&(!z||x.s===z)&&(x.n+x.t+x.s+x.c+x.code).toLowerCase().includes(q));
  $('cats').innerHTML=cats.map(c=>`<button class="btn${c===cat?' on':''}" onclick="cat='${c}';show()">${c}</button>`).join('');
  $('grid').innerHTML=list.map(x=>`<div class="card dress" onclick="pick(${x.id})"><span class="tag ${x.ok?'ok':'no'}">${x.ok?'ว่าง':'ถูกเช่า'}</span><div class="pic" style="--c:${x.h}">👗</div><div class="info"><b>${x.n}</b> #${x.code}<br>ไซซ์ ${x.s} · ${x.t}<br>ราคาเช่า ${f(x.p)} บาท/วัน</div></div>`).join('')||'<p>ไม่พบชุดที่ค้นหา ลองเปลี่ยนคำค้นหรือตัวกรอง</p>';
}
$('qb').onclick=show; $('q').oninput=show; $('sz').onchange=show;

// Detail + booking
function pick(id){
  cur=dresses.find(x=>x.id===id);
  $('detail').innerHTML=`<div class="pic big" style="--c:${cur.h}">👗</div><h2>${cur.n} #${cur.code}</h2><p>ไซซ์: ${cur.s} · สี: ${cur.c} · ประเภท: ${cur.t}</p><p>ราคาเช่า: ${f(cur.p)} บาท/วัน · มัดจำ: ${f(cur.d)} บาท</p><p>สถานะ: <b class="${cur.ok?'g':'r'}">${cur.ok?'ว่าง':'ถูกเช่าแล้ว'}</b></p>`;
  $('bf').reset();$('bbtn').disabled=!cur.ok;calc();go('booking');
}
function calc(){
  const a=$('d1').value, b=$('d2').value;
  days=a&&b?Math.max(1,Math.round((new Date(b)-new Date(a))/864e5)):1;
  $('sum').innerHTML=a&&b?`สรุปค่าใช้จ่าย: ค่าเช่า ${f(cur.p)} × ${days} วัน + มัดจำ ${f(cur.d)} = <b>${f(cur.p*days+cur.d)} บาท</b>`:'เลือกวันรับและวันคืนชุด เพื่อดูสรุปค่าใช้จ่าย';
}
$('d1').min=new Date().toISOString().slice(0,10);
['d1','d2'].forEach(i=>$(i).oninput=()=>{$('d2').min=$('d1').value;calc()});

$('bf').onsubmit=e=>{
  e.preventDefault();
  bk={code:'BK'+String(seq++).padStart(5,'0'),rent:cur.p*days,dep:cur.d};
  bk.total=bk.rent+bk.dep;
  $('pinfo').innerHTML=`<h2>รายละเอียดค่าเช่า</h2><div class="row"><span>รหัสการจอง</span><b>${bk.code}</b></div><div class="row"><span>ชุด</span><span>${cur.n} #${cur.code} × ${days} วัน</span></div><div class="row"><span>ค่าเช่า</span><span>${f(bk.rent)} บาท</span></div><div class="row"><span>ค่ามัดจำ</span><span>${f(bk.dep)} บาท</span></div><div class="row"><b>รวมทั้งสิ้น</b><b>${f(bk.total)} บาท</b></div>`;
  $('rc').hidden=true;$('pbtn').disabled=true;method=null;
  document.querySelectorAll('#pay .btn').forEach(x=>x.classList.remove('on'));
  go('payment');
};

// Payment
$('pay').innerHTML=pays.map(([k,l])=>`<button type="button" class="btn" onclick="setPay(this,'${k}')">${l}</button>`).join('');
function setPay(el,k){method=k;document.querySelectorAll('#pay .btn').forEach(x=>x.classList.toggle('on',x===el));$('pbtn').disabled=false}
$('pbtn').onclick=()=>{
  cur.ok=0;show();
  $('rc').innerHTML=`<h2>✅ ชำระเงินสำเร็จ</h2><div class="row"><span>เลขที่ใบเสร็จ</span><b>RC${bk.code.slice(2)}</b></div><div class="row"><span>รหัสการจอง</span><span>${bk.code}</span></div><div class="row"><span>ช่องทางชำระเงิน</span><span>${pays.find(p=>p[0]===method)[1]}</span></div><div class="row"><b>ยอดชำระ</b><b>${f(bk.total)} บาท</b></div><button class="btn main" style="margin-top:16px" onclick="go('search')">กลับไปหน้าค้นหาชุด</button>`;
  $('rc').hidden=false;$('pbtn').disabled=true;cur=null;
};

show();go('login');
</script>
</body>
</html>
